name: Bug report
description: Report behavior that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve NetCoreApplicationTemplate.

        **Security-sensitive reports do not belong in public Issues.**
        If the report includes exploit details, secrets, private data, or a
        practical vulnerability, use the repository's private vulnerability
        reporting path instead.

  - type: input
    id: template-version
    attributes:
      label: Template version
      description: Which NetCoreApplicationTemplate package version or commit generated the project?
      placeholder: 2.9.0 or a commit SHA
    validations:
      required: true

  - type: dropdown
    id: authentication-option
    attributes:
      label: Authentication option
      description: Which authentication option was selected when the project was generated?
      options:
        - Cookie
        - None
    validations:
      required: true

  - type: dropdown
    id: database-provider
    attributes:
      label: Database provider
      description: Which database provider was selected when the project was generated?
      options:
        - SQLite
        - SQL Server
        - None
    validations:
      required: true

  - type: input
    id: host-os
    attributes:
      label: Host operating system
      placeholder: Windows 11, Ubuntu 24.04, or macOS 15
    validations:
      required: true

  - type: input
    id: dotnet-sdk-version
    attributes:
      label: .NET SDK version
      description: Paste the output of `dotnet --version`.
      placeholder: 10.0.100
    validations:
      required: true

  - type: dropdown
    id: fresh-project-reproduction
    attributes:
      label: Fresh project reproduction
      description: Does the problem reproduce in a newly generated project with the same options?
      options:
        - "Yes"
        - "No"
        - Not yet tested
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest useful reproduction.
      placeholder: |
        1. Create a project with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, configuration notes, or other useful details.
    validations:
      required: false

  - type: checkboxes
    id: submission-checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing Issues to avoid creating a duplicate.
          required: true
        - label: I removed secrets, private data, credentials, and other sensitive information.
          required: true
