name: Update README release section

on:
  release:
    types: [published]

# Deny all token permissions unless granted by a job.
permissions: {}

# Release events share one README update branch. Serialize them so a newer
# release safely updates the existing automation PR instead of racing it.
concurrency:
  group: publish-release-readme-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Create least-privilege release PR token
        id: release-pr-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Update README release section
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          python <<'PY'
          from pathlib import Path
          import os
          import re

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          tag = os.environ["RELEASE_TAG"]
          name = os.environ["RELEASE_NAME"] or tag
          url = os.environ["RELEASE_URL"]

          replacement = f"""<!-- BEGIN LATEST_RELEASE -->
          Current release: __[{name}]({url})__

          Tag: `{tag}`
          <!-- END LATEST_RELEASE -->"""

          pattern = r"<!-- BEGIN LATEST_RELEASE -->.*?<!-- END LATEST_RELEASE -->"

          updated, count = re.subn(
              pattern,
              replacement,
              text,
              flags=re.DOTALL,
          )

          if count == 0:
              raise SystemExit("README release markers were not found.")

          if updated != text:
              readme.write_text(updated, encoding="utf-8")
          PY

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.release-pr-app-token.outputs.token }}
          commit-message: "Update README latest release section"
          title: "Update README latest release section"
          body: |
            Updates the README latest release section after publishing `${{ github.event.release.tag_name }}`.
          branch: docs/update-latest-release
          base: main
          delete-branch: true
          add-paths: |
            README.md
