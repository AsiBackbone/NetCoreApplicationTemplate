name: Update README release section

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Stable release tag to update the README with (for example, v2.9.0)"
        required: true

# Deny all token permissions unless granted by a job.
permissions: {}

# Release events share one README update branch. Serialize them so a newer
# release safely updates the existing automation PR instead of racing it.
concurrency:
  group: publish-release-readme-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Create least-privilege release PR token
        id: release-pr-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: false

      # Resolve release metadata from the release itself so manual dispatch and
      # release events produce identical README content.
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail

          tag="$EVENT_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          fi

          # Stable tags only; prereleases must not become the README's current release.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping README update: '$tag' is not a stable release tag."
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release view "$tag" --repo "$REPOSITORY" --json tagName,name,url \
            > "$RUNNER_TEMP/release.json"

          printf 'skip=false\n' >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      # The support policy repeats the latest published release in two
      # current-facing markers. Advance them with the README block so a
      # published release cannot leave either behind; version-consistency.yml
      # fails the pull request if any of the three disagree.
      - name: Update latest release markers
        if: steps.release.outputs.skip == 'false'
        shell: bash
        env:
          RELEASE_JSON: ${{ runner.temp }}/release.json
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          release = json.loads(Path(os.environ["RELEASE_JSON"]).read_text(encoding="utf-8"))
          tag = release["tagName"]
          name = release.get("name") or tag
          url = release["url"]

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          replacement = f"""<!-- BEGIN LATEST_RELEASE -->
          Current release: __[{name}]({url})__

          Tag: `{tag}`
          <!-- END LATEST_RELEASE -->"""

          pattern = r"<!-- BEGIN LATEST_RELEASE -->.*?<!-- END LATEST_RELEASE -->"

          updated, count = re.subn(pattern, replacement, text, flags=re.DOTALL)

          if count == 0:
              raise SystemExit("README release markers were not found.")

          if updated != text:
              readme.write_text(updated, encoding="utf-8")

          version = tag[1:]
          support = Path(".github/SUPPORT.md")
          with support.open(encoding="utf-8", newline="") as handle:
              support_text = handle.read()

          version_pattern = r"\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?"
          support_markers = [
              (
                  "maintenance-posture latest published release",
                  rf"(Release\s+`){version_pattern}(`\s+is\s+the\s+latest\s+published\s+release\.)",
              ),
              (
                  "version support lifecycle latest release",
                  rf"(?m)(^\|\s*`\d+\.x`\s*\|\s*Current stable line;\s*latest\s+release\s+`){version_pattern}(`)",
              ),
          ]

          support_updated = support_text
          for description, marker_pattern in support_markers:
              support_updated, marker_count = re.subn(
                  marker_pattern,
                  lambda match: f"{match.group(1)}{version}{match.group(2)}",
                  support_updated,
              )

              if marker_count != 1:
                  raise SystemExit(
                      f"SUPPORT.md {description} marker must appear exactly once; found {marker_count}."
                  )

          if support_updated != support_text:
              with support.open("w", encoding="utf-8", newline="") as handle:
                  handle.write(support_updated)
          PY

      - name: Create pull request
        if: steps.release.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.release-pr-app-token.outputs.token }}
          commit-message: "Update README latest release section"
          title: "Update README latest release section"
          body: |
            Updates the README latest release section and the support policy's latest-release markers after publishing `${{ steps.release.outputs.tag }}`.
          branch: docs/update-latest-release
          base: main
          delete-branch: true
          add-paths: |
            README.md
            .github/SUPPORT.md
