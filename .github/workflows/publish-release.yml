name: Update README release section

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Stable release tag to update the README with (for example, v2.9.0)"
        required: true

# Deny all token permissions unless granted by a job.
permissions: {}

# Release events share one README update branch. Serialize them so a newer
# release safely updates the existing automation PR instead of racing it.
concurrency:
  group: publish-release-readme-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Create least-privilege release PR token
        id: release-pr-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: false

      # Resolve release metadata from the release itself so manual dispatch and
      # release events produce identical README content.
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail

          tag="$EVENT_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          fi

          # Stable tags only; prereleases must not become the README's current release.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping README update: '$tag' is not a stable release tag."
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release view "$tag" --repo "$REPOSITORY" --json tagName,name,url \
            > "$RUNNER_TEMP/release.json"

          printf 'skip=false\n' >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Update README release section
        if: steps.release.outputs.skip == 'false'
        shell: bash
        env:
          RELEASE_JSON: ${{ runner.temp }}/release.json
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          release = json.loads(Path(os.environ["RELEASE_JSON"]).read_text(encoding="utf-8"))
          tag = release["tagName"]
          name = release.get("name") or tag
          url = release["url"]

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          replacement = f"""<!-- BEGIN LATEST_RELEASE -->
          Current release: __[{name}]({url})__

          Tag: `{tag}`
          <!-- END LATEST_RELEASE -->"""

          pattern = r"<!-- BEGIN LATEST_RELEASE -->.*?<!-- END LATEST_RELEASE -->"

          updated, count = re.subn(pattern, replacement, text, flags=re.DOTALL)

          if count == 0:
              raise SystemExit("README release markers were not found.")

          if updated != text:
              readme.write_text(updated, encoding="utf-8")
          PY

      - name: Create pull request
        if: steps.release.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.release-pr-app-token.outputs.token }}
          commit-message: "Update README latest release section"
          title: "Update README latest release section"
          body: |
            Updates the README latest release section after publishing `${{ steps.release.outputs.tag }}`.
          branch: docs/update-latest-release
          base: main
          delete-branch: true
          add-paths: |
            README.md
