name: Update README release section

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Stable release tag to update the README with (for example, v2.9.0)"
        required: true

# Deny all token permissions unless granted by a job.
permissions: {}

# Release events share one README update branch. Serialize them so a newer
# release safely updates the existing automation PR instead of racing it.
concurrency:
  group: publish-release-readme-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Create least-privilege release PR token
        id: release-pr-app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: false

      # Resolve release metadata from the release itself so manual dispatch and
      # release events produce identical README content.
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail

          tag="$EVENT_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          fi

          # Stable tags only; prereleases must not become the README's current release.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping README update: '$tag' is not a stable release tag."
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release view "$tag" --repo "$REPOSITORY" --json tagName,name,url \
            > "$RUNNER_TEMP/release.json"

          printf 'skip=false\n' >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      # The support policy repeats the latest published release in two
      # current-facing markers. Advance them with the README block so a
      # published release cannot leave either behind; version-consistency.yml
      # fails the pull request if any of the three disagree.
      - name: Update latest release markers
        if: steps.release.outputs.skip == 'false'
        shell: bash
        env:
          RELEASE_JSON: ${{ runner.temp }}/release.json
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          release = json.loads(Path(os.environ["RELEASE_JSON"]).read_text(encoding="utf-8"))
          tag = release["tagName"]
          name = release.get("name") or tag
          url = release["url"]

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          replacement = f"""<!-- BEGIN LATEST_RELEASE -->
          Current release: __[{name}]({url})__

          Tag: `{tag}`
          <!-- END LATEST_RELEASE -->"""

          pattern = r"<!-- BEGIN LATEST_RELEASE -->.*?<!-- END LATEST_RELEASE -->"

          updated, count = re.subn(pattern, replacement, text, flags=re.DOTALL)

          if count == 0:
              raise SystemExit("README release markers were not found.")

          if updated != text:
              readme.write_text(updated, encoding="utf-8")

          version = tag[1:]
          support = Path("SUPPORT.md")
          with support.open(encoding="utf-8", newline="") as handle:
              support_text = handle.read()

          version_pattern = r"\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?"
          support_markers = [
              (
                  "maintenance-posture latest published release",
                  rf"(Release\s+`){version_pattern}(`\s+is\s+the\s+latest\s+published\s+release\.)",
              ),
              (
                  "version support lifecycle latest release",
                  rf"(?m)(^\|\s*`\d+\.x`\s*\|\s*Current stable line;\s*latest\s+release\s+`){version_pattern}(`)",
              ),
          ]

          support_updated = support_text
          for description, marker_pattern in support_markers:
              support_updated, marker_count = re.subn(
                  marker_pattern,
                  lambda match: f"{match.group(1)}{version}{match.group(2)}",
                  support_updated,
              )

              if marker_count != 1:
                  raise SystemExit(
                      f"SUPPORT.md {description} marker must appear exactly once; found {marker_count}."
                  )

          if support_updated != support_text:
              with support.open("w", encoding="utf-8", newline="") as handle:
                  handle.write(support_updated)

          # These pages describe the latest *published* release, never the
          # prepared version that may already exist on main.
          notes_name = f"release-notes-{version.replace('.', '')}.md"
          if not Path("docs/articles", notes_name).is_file():
              raise SystemExit(f"Published release notes not found: {notes_name}")

          homepage = Path("docs/index.md")
          homepage_text = homepage.read_text(encoding="utf-8")
          homepage_row = (
              f"| Current release | [{version}]({url}) "
              f"([release notes](articles/{notes_name})) |"
          )
          homepage_updated, count = re.subn(
              r"(?m)^\| Current release \|.*$", lambda _: homepage_row, homepage_text
          )
          if count != 1:
              raise SystemExit(f"docs/index.md current release row count is {count}, expected 1.")
          if homepage_updated != homepage_text:
              homepage.write_text(homepage_updated, encoding="utf-8")

          packaging = Path("docs/articles/template-packaging.md")
          packaging_text = packaging.read_text(encoding="utf-8")
          packaging_updated = packaging_text
          replacements = [
              (r"(?m)^\| Current package version \| `[^`]+` \|$",
               f"| Current package version | `{version}` |"),
              (r"(?m)^dotnet new install NetCoreApplicationTemplate::\d+\.\d+\.\d+$",
               f"dotnet new install NetCoreApplicationTemplate::{version}"),
              (r"(?m)^dotnet new install \./artifacts/template-package/NetCoreApplicationTemplate\.\d+\.\d+\.\d+\.nupkg$",
               f"dotnet new install ./artifacts/template-package/NetCoreApplicationTemplate.{version}.nupkg"),
          ]
          for pattern, replacement in replacements:
              packaging_updated, count = re.subn(
                  pattern, lambda _: replacement, packaging_updated
              )
              if count != 1:
                  raise SystemExit(
                      f"docs/articles/template-packaging.md release marker count is {count}, expected 1: {pattern}"
                  )
          if packaging_updated != packaging_text:
              packaging.write_text(packaging_updated, encoding="utf-8")
          PY

      - name: Create pull request
        if: steps.release.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.release-pr-app-token.outputs.token }}
          commit-message: "docs: synchronize published release references"
          title: "docs: synchronize published release references"
          body: |
            Updates README, SUPPORT, the documentation homepage, and pinned template packaging examples after publishing `${{ steps.release.outputs.tag }}`.
          branch: docs/update-latest-release
          base: main
          delete-branch: true
          add-paths: |
            README.md
            SUPPORT.md
            docs/index.md
            docs/articles/template-packaging.md
