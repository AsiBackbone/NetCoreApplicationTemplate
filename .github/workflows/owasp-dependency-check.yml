# This workflow uses actions that are not certified by GitHub. They are provided
# by a third party and governed by separate terms, privacy policies, and support.
# OWASP Dependency-Check scans the restored NuGet dependency graph and uploads
# SARIF results to GitHub code scanning.

name: OWASP Dependency-Check software composition analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 0'
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.slnx'
      - '**/packages.config'
      - '**/packages.lock.json'
      - '**/packages.*.lock.json'
      - '**/Directory.Packages.props'
      - '**/Directory.Build.props'
      - 'dependency-check-suppressions.xml'
      - '.github/workflows/owasp-dependency-check.yml'

  pull_request:
    paths:
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.slnx'
      - '**/packages.config'
      - '**/packages.lock.json'
      - '**/packages.*.lock.json'
      - '**/Directory.Packages.props'
      - '**/Directory.Build.props'
      - 'dependency-check-suppressions.xml'
      - '.github/workflows/owasp-dependency-check.yml'

permissions: {}

jobs:
  dependency-check:
    name: Analyze dependencies with OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./NetCoreApplicationTemplate.slnx --locked-mode

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: 'NetCoreApplicationTemplate'
          path: '.'
          format: 'ALL'
          others: '--suppression=/github/workspace/dependency-check-suppressions.xml'

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 5
          if-no-files-found: warn

      - name: Upload results to code-scanning
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check
