# This workflow uses actions that are not certified by GitHub. They are provided
# by a third party and governed by separate terms, privacy policies, and support.
# OWASP Dependency-Check scans the restored NuGet dependency graph and uploads
# SARIF results to GitHub code scanning.
#
# Dependency-Check findings are report-only; the scan is deliberately not invoked
# with --failOnCVSS. Suppression lifecycle validation is a separate policy gate.
# The workflow runs weekly, on demand, and on pushes to main that touch project
# or lock files, so it never runs before a merge; a hard failure here
# would block main rather than the change that introduced the finding. Findings
# are triaged through code scanning, and RELEASE.md requires explicit
# confirmation that none are release-blocking before a stable tag.

name: OWASP Dependency-Check software composition analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 0'
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.slnx'
      - '**/packages.config'
      - '**/packages.lock.json'
      - '**/packages.*.lock.json'
      - '**/Directory.Packages.props'
      - '**/Directory.Build.props'
      - 'dependency-check-suppressions.xml'
      - 'eng/Validate-DependencyCheckSuppressions.ps1'
      - '.github/workflows/owasp-dependency-check.yml'

  pull_request:
    paths:
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.slnx'
      - '**/packages.config'
      - '**/packages.lock.json'
      - '**/packages.*.lock.json'
      - '**/Directory.Packages.props'
      - '**/Directory.Build.props'
      - 'dependency-check-suppressions.xml'
      - 'eng/Validate-DependencyCheckSuppressions.ps1'
      - '.github/workflows/owasp-dependency-check.yml'

permissions: {}

jobs:
  validate-suppressions:
    name: Validate dependency-check suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate suppression expiry and rationale
        shell: pwsh
        run: ./eng/Validate-DependencyCheckSuppressions.ps1 -ReviewWindowDays 30 -FailOnReviewWindow

  dependency-check:
    name: Analyze dependencies with OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ./NetCoreApplicationTemplate.slnx --locked-mode

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: 'NetCoreApplicationTemplate'
          path: '.'
          format: 'ALL'
          others: '--suppression=/github/workspace/dependency-check-suppressions.xml'

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 5
          if-no-files-found: warn

      - name: Upload results to code-scanning
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check
