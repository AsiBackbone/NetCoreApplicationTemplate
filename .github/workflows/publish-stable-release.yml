name: Publish Stable Release

on:
  push:
    tags:
      - 'v*.*.*'

# Keep the tag as the single release trigger. The reusable workflows below
# retain job-scoped permissions and the template-package environment remains
# the sole human approval boundary for stable publication.
permissions: {}

concurrency:
  group: publish-stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-template-package:
    name: Publish template package evidence and package
    permissions:
      attestations: write
      checks: read
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/publish-template-package.yml
    with:
      skip_publish: false

  publish-container:
    name: Publish signed container and complete release evidence
    needs: publish-template-package
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
      security-events: write
    uses: ./.github/workflows/publish-container.yml

  update-readme:
    name: Request README release update
    needs: publish-container
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch README update workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          gh workflow run publish-release.yml
          --repo "$REPOSITORY"
          --ref main
          -f release-tag="$RELEASE_TAG"

  release-complete:
    name: Stable release publication complete
    needs:
      - publish-container
      - update-readme
    if: >-
      ${{ !cancelled() &&
          needs.publish-container.result == 'success' &&
          needs.update-readme.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Stable release publication and evidence verification completed successfully."
