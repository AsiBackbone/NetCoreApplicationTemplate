name: Documentation Link Validation

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/Ensure-PublishedHtmlMetadata.ps1'
      - 'scripts/Validate-ApiReference.ps1'
      - 'scripts/Validate-LandingPage.ps1'
      - 'scripts/Test-PublishedReleaseReferences.ps1'
      - 'lychee.toml'
      - '.config/dotnet-tools.json'
      - '.github/workflows/link-validation.yml'

  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/Ensure-PublishedHtmlMetadata.ps1'
      - 'scripts/Validate-ApiReference.ps1'
      - 'scripts/Validate-LandingPage.ps1'
      - 'scripts/Test-PublishedReleaseReferences.ps1'
      - 'lychee.toml'
      - '.config/dotnet-tools.json'
      - '.github/workflows/link-validation.yml'

  # Detect cross-repository and external link rot even when NCAT
  # documentation has not recently changed.
  schedule:
    - cron: '23 13 * * 0'

permissions: {}

concurrency:
  group: documentation-link-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-links:
    name: Validate documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout NCAT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Learning reference
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AsiBackbone/Learning
          ref: main
          path: .external/Learning
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build NCAT DocFX site
        run: dotnet tool run docfx -- docs/docfx.json --warningsAsErrors

      - name: Test documentation landing-page validator
        shell: pwsh
        run: ./scripts/Validate-LandingPage.ps1 -SelfTest

      - name: Validate documentation landing page
        shell: pwsh
        run: ./scripts/Validate-LandingPage.ps1 -SiteDirectory ./docs/_site

      - name: Test release-reference validator
        shell: pwsh
        run: ./scripts/Test-PublishedReleaseReferences.ps1 -SelfTest

      - name: Validate release references in generated HTML
        shell: pwsh
        run: ./scripts/Test-PublishedReleaseReferences.ps1 -SiteDirectory ./docs/_site

      - name: Test API reference validator
        shell: pwsh
        run: ./scripts/Validate-ApiReference.ps1 -SelfTest

      - name: Validate generated API reference surface
        shell: pwsh
        run: ./scripts/Validate-ApiReference.ps1 -SiteDirectory ./docs/_site

      - name: Add coverage publication placeholder
        shell: pwsh
        run: |
          # publish-docs.yml injects the generated coverage site after DocFX, so
          # documentation links to it by its absolute published URL. Add only the
          # landing-page placeholder here; the offline check remaps that URL to it
          # without running the full test/coverage pipeline twice.
          New-Item -ItemType Directory -Path "./docs/_site/coverage" -Force | Out-Null
          Set-Content -LiteralPath "./docs/_site/coverage/index.html" -Value "<!doctype html><html><head><title>Coverage publication placeholder</title></head><body></body></html>"

      - name: Test published HTML metadata tooling
        shell: pwsh
        run: ./scripts/Ensure-PublishedHtmlMetadata.ps1 -SelfTest

      - name: Ensure published HTML metadata
        shell: pwsh
        run: |
          ./scripts/Ensure-PublishedHtmlMetadata.ps1 `
            -SiteDirectory "./docs/_site" `
            -NoIndexPathPrefix @("coverage")

      - name: Validate complete NCAT publication locally
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --root-dir "${{ github.workspace }}"
            --exclude "^https://github[.]com/AsiBackbone/NetCoreApplicationTemplate/blob/[0-9]+/merge/"
            --remap "^https://asibackbone\.github\.io/NetCoreApplicationTemplate/coverage/$ file://${{ github.workspace }}/docs/_site/coverage/index.html"
            --remap "^https://github\.com/AsiBackbone/NetCoreApplicationTemplate/blob/main/(.*)/#L[0-9]+$ file://${{ github.workspace }}/\$1"
            --remap "^https://github\.com/AsiBackbone/NetCoreApplicationTemplate/blob/main file://${{ github.workspace }}"
            './README.md'
            './CONTRIBUTING.md'
            './SECURITY.md'
            './PACKAGE-README.md'
            './.github/*.md'
            './docs/_site/**/*.html'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          jobSummary: true

      - name: Validate complete NCAT publication and external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --exclude "^https://github[.]com/AsiBackbone/NetCoreApplicationTemplate/blob/[0-9]+/merge/"
            --remap "^https://github\.com/AsiBackbone/NetCoreApplicationTemplate/blob/main/(.*)/#L[0-9]+$ file://${{ github.workspace }}/\$1"
            --remap "^https://github\.com/AsiBackbone/NetCoreApplicationTemplate/blob/main file://${{ github.workspace }}"
            './README.md'
            './CONTRIBUTING.md'
            './SECURITY.md'
            './PACKAGE-README.md'
            './.github/*.md'
            './docs/_site/**/*.html'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          jobSummary: true

      - name: Validate Learning backlinks to NCAT
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}/.external/Learning"
            --remap "^https://github\.com/AsiBackbone/Learning/blob/main file://${{ github.workspace }}/.external/Learning"
            './.external/Learning/docs/architecture/growing-beyond-a-simple-application-structure.md'
            './.external/Learning/docs/aspnetcore/netcoreapplicationtemplate-adr-case-study.md'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          jobSummary: true

      # Zenodo DOIs are excluded from Lychee (see lychee.toml) and resolved here
      # instead. Scheduled and manual runs fail when a DOI does not resolve after
      # retries, so an archive that disappears is still reported as link rot.
      # Pull request and push runs only warn, because Zenodo intermittently times
      # out or returns HTTP 500 to automated requests, and that says nothing
      # about the change under review.
      - name: Resolve Zenodo archive DOIs
        if: ${{ !cancelled() }}
        shell: bash
        env:
          STRICT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          mapfile -t dois < <(grep -rhoE 'https://doi\.org/10\.5281/zenodo\.[0-9]+' \
            --include='*.md' --exclude-dir='.link-targets' . | sort -u)
          if [[ ${#dois[@]} -eq 0 ]]; then
            echo "::error::No Zenodo DOI links were found in Markdown; update this step if the archive links moved."
            exit 1
          fi

          unresolved=0
          for doi in "${dois[@]}"; do
            status=""
            if status="$(curl --silent --show-error --fail --location \
                --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 10 --max-time 30 \
                --retry 4 --retry-delay 15 --retry-all-errors \
                --user-agent 'AsiBackbone-NCAT-link-validation (+https://github.com/AsiBackbone/NetCoreApplicationTemplate)' \
                "$doi")"; then
              echo "Resolved $doi (HTTP $status)."
              continue
            fi

            unresolved=$((unresolved + 1))
            if [[ "$STRICT" == "true" ]]; then
              echo "::error::$doi did not resolve after retries (last HTTP status ${status:-none})."
            else
              echo "::warning::$doi did not resolve after retries (last HTTP status ${status:-none}). Not failing this ${GITHUB_EVENT_NAME} run; the weekly scheduled run reports a DOI that stays unavailable."
            fi
          done

          if [[ "$unresolved" -gt 0 && "$STRICT" == "true" ]]; then
            exit 1
          fi
          echo "Checked ${#dois[@]} Zenodo DOI(s); ${unresolved} unresolved."
