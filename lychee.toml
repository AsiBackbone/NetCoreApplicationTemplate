verbose = "info"
no_progress = true

max_retries = 2
timeout = 20
retry_wait_time = 2

max_concurrency = 8
host_concurrency = 2

# Treat rate limiting as inconclusive rather than a broken link.
accept = ["200..=399", "429"]

# Do not attempt to validate localhost/private addresses used in
# local-development documentation.
exclude_all_private = true

# Email-address validation is outside the scope of documentation links.
include_mail = false

exclude = [
  # Private vulnerability reporting may intentionally return 404 to
  # unauthenticated link checkers.
  '^https://github\.com/AsiBackbone/NetCoreApplicationTemplate/security/advisories/new$',

  # Zenodo archive DOIs (Learning, AsiBackbone, and NCAT) intermittently time
  # out or return HTTP 500 to automated checkers even though they resolve, which
  # failed a push whose change did not touch them. tools/validate-landing-page.cs
  # pins each DOI's exact value, and the "Resolve Zenodo archive DOIs" step in
  # .github/workflows/link-validation.yml resolves every one with its own
  # retries: it fails scheduled and manual runs but only warns on pull request
  # and push runs, so a DOI that stops resolving is still reported.
  '^https://doi\.org/10\.5281/zenodo\.[0-9]+$'
]
